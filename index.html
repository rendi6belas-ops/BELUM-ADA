function scheduleToMin(v, fallbackMin) {
  if (typeof v === "string" && v.indexOf(":") !== -1) {
    const parts = v.split(":");
    const hh = parseInt(parts[0], 10), mm = parseInt(parts[1], 10);
    if (!isNaN(hh) && !isNaN(mm)) return Math.min(1439, Math.max(0, hh * 60 + mm));
  }
  const n = parseInt(v, 10);
  if (!isNaN(n)) {
    if (n >= 0 && n <= 23) return n * 60;
    return Math.min(1439, Math.max(0, n));
  }
  return fallbackMin;
}
function fmtSchedule(min) {
  const m = Math.min(1439, Math.max(0, min | 0));
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
}
function parseTimeInput(str) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(str || "").trim());
  if (!m) return null;
  const h = parseInt(m[1], 10), mm = parseInt(m[2], 10);
  if (h > 23 || mm > 59) return null;
  return h * 60 + mm;
}

function formatDateID(d) {

  return `${hari}, ${tgl}`;
}
function formatDateAbsensi(d) {
  const hari = new Intl.DateTimeFormat("id-ID", { weekday: "long" }).format(d);

  return `${hariCap}, ${tgl}`;
}

async function copyText(text) {
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch { return false; }
}

function getWibParts(d = new Date()) {
  const fmt = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Jakarta",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hour12: false
  });
  const parts = Object.fromEntries(fmt.formatToParts(d).filter(p => p.type !== "literal").map(p => [p.type, p.value]));
  return {
    dateStr: `${parts.year}-${parts.month}-${parts.day}`,
    hour: parseInt(parts.hour, 10),
    minute: parseInt(parts.minute, 10),
    second: parseInt(parts.second, 10)
  };
}

function dateOffsetStr(d, offsetDays) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + offsetDays);
  return toInputDate(x);
}
function last7DateStrs(d) {
  const arr = [];
  for (let i = 6; i >= 0; i--) arr.push(dateOffsetStr(d, -i));
  return arr;
}
function weekRangesInMonth(year, month) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const ranges = [];
  const bounds = [[1,7],[8,14],[15,21],[22, daysInMonth]];
  bounds.forEach((b, idx) => {
    if (b[0] > daysInMonth) return;
    const end = Math.min(b[1], daysInMonth);
    const s = `${year}-${String(month+1).padStart(2,"0")}-${String(b[0]).padStart(2,"0")}`;
    const e = `${year}-${String(month+1).padStart(2,"0")}-${String(end).padStart(2,"0")}`;
    ranges.push({ week: idx + 1, start: s, end: e });
  });
  return ranges;
}
function eachDateStr(startStr, endStr) {
  const out = [];
  const [ys,ms,ds] = startStr.split("-").map(Number);
  const [ye,me,de] = endStr.split("-").map(Number);
  let cur = new Date(ys, ms-1, ds);
  const end = new Date(ye, me-1, de);
  while (cur <= end) {
    out.push(toInputDate(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

}

function Toast({ msg, visible }) {
  if (!visible) return null;
  return h("div", {
    style: {
      position:"fixed", bottom:24, left:"50%", transform:"translateX(-50%)", zIndex:200,
      background:"#111", color:"#fff", padding:"12px 20px", borderRadius:999,
      fontSize:13, fontWeight:700, boxShadow:"0 12px 32px rgba(0,0,0,.3)",
      display:"flex", alignItems:"center", gap:8, maxWidth:"90vw",
      animation:"slideUp .25s ease"
    }
  }, [
    h("span", null, msg.includes("Berhasil") || msg.includes("disalin") || msg.includes("ditambah") || msg.includes("dihapus") || msg.includes("tersimpan") || msg.includes("sinkron") ? "✓" : "⚠"),
    h("span", { style:{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"} }, msg)
  ]);
}

    setUndoStack(s => s.slice(0, -1));

      if (v === null || v === undefined) {

  useEffect(() => {
    const fillAlfaAtClose = async () => {
      if (autoResetRunning.current) return;
      if (!navigator.onLine) return;
      if (!autoResetEnabled) return;
      try {
        const wib = getWibParts();
        if (wib.hour * 60 + wib.minute < autoResetMin) return;
        const today = wib.dateStr;
        const snap = await db.ref(metaLastAlfaFillPath()).once("value");
        if (snap.val() === today) return;

        autoResetRunning.current = true;
        let totalFilled = 0;

        for (const b of BATCH_LIST) {
          const namesSnap = await db.ref(studentsPath(b)).once("value");
          let names = namesSnap.val();
          if (!Array.isArray(names) || !names.length) {
            names = BATCH_STUDENTS[b] || [];
          }
          names = names.map(n => String(n).trim()).filter(Boolean);

          const attPath = attendancePath(b, today);
          const attSnap = await db.ref(attPath).once("value");
          const existing = attSnap.val() || {};
          const updates = {};
          let changed = false;

          // Normalisasi key yang sudah ada (kalau ada versi unicode-escaped)
          const existingByRealName = {};
          Object.keys(existing).forEach(k => {
            const name = fromFbKey(k);
            const item = existing[k];
            const st = item && typeof item === "object" ? normalizeStatus(item.status) : normalizeStatus(item);
            if (st) {
              existingByRealName[name] = (item && typeof item === "object")
                ? { status: st, reason: item.reason || "" }
                : { status: st, reason: "" };
              // pastikan key tersimpan dalam bentuk toFbKey
              if (k !== toFbKey(name)) {
                updates[toFbKey(name)] = existingByRealName[name];
                updates[k] = null;
                changed = true;
              }
            }
          });

          names.forEach(n => {
            if (!existingByRealName[n]) {
              updates[toFbKey(n)] = { status: "ALFA", reason: "" };
              changed = true;
              totalFilled++;
            }
          });

          if (changed && Object.keys(updates).length) {
            await db.ref(attPath).update(updates);
          }
        }

        await db.ref(metaLastAlfaFillPath()).set(today);

        if (dateStr === today) {
          skipNextSave.current = true;
          setAttendance(prev => {
            const n = { ...prev };
            students.forEach(s => { if (!n[s]) n[s] = "ALFA"; });
            return n;
          });
          setTimeout(() => { skipNextSave.current = false; }, 300);
        }

        if (totalFilled > 0) {
          toast("✅ Jam tutup — " + totalFilled + " yang belum absen ditandai ALFA");
        } else {
          toast("✅ Jam tutup — semua sudah punya status");
        }
        autoResetRunning.current = false;
      } catch (err) {
        console.warn("auto alfa fill failed", err);
        autoResetRunning.current = false;
      }
    };
    fillAlfaAtClose();
    const id = setInterval(fillAlfaAtClose, 60000);
    return () => clearInterval(id);
  }, [autoResetMin, autoResetEnabled, dateStr, students]);

const doRename = async () => {
  if (!renameTarget) return;
  const oldName = renameTarget;
  const newName = renameValue.trim().toUpperCase();
  if (!newName) { toast("⚠️ Nama tidak boleh kosong"); return; }
  if (newName === oldName) { setRenameTarget(null); return; }
  if (students.some(s => s.toLowerCase() === newName.toLowerCase())) {
    toast("⚠️ Nama \"" + newName + "\" sudah dipakai");
    return;
  }
  setRenameSaving(true);
  try {
    // 1. Update array students
    const next = students.map(s => s === oldName ? newName : s).sort((a,b)=>a.localeCompare(b,"id"));
    await db.ref(studentsPath(batch)).set(next);
    setStudents(next);

    // 2. Rename key di SEMUA attendance (scan sekali)
    const attSnap = await db.ref(`${FB_ROOT}/batch_${batch}/attendance`).once("value");
    const all = attSnap.val() || {};
    const oldKey = toFbKey(oldName);
    const newKey = toFbKey(newName);
    const updates = {};
    let moved = 0;
    Object.keys(all).forEach(dateKey => {
      const day = all[dateKey];
      if (!day || typeof day !== "object") return;
      Object.keys(day).forEach(actKey => {
        const act = day[actKey];
        if (!act || typeof act !== "object") return;
        if (act[oldKey] !== undefined) {
          updates[`${FB_ROOT}/batch_${batch}/attendance/${dateKey}/${actKey}/${newKey}`] = act[oldKey];
          updates[`${FB_ROOT}/batch_${batch}/attendance/${dateKey}/${actKey}/${oldKey}`] = null;
          moved++;
        }
      });
    });
    if (Object.keys(updates).length) {
      await db.ref().update(updates);
    }

    // 3. Update state lokal (attendance/izinReasons/historyMap)
    setAttendance(prev => {
      if (prev[oldName] === undefined) return prev;
      const n = { ...prev };
      n[newName] = n[oldName];
      delete n[oldName];
      return n;
    });
    setIzinReasons(prev => {
      if (prev[oldName] === undefined) return prev;
      const n = { ...prev };
      n[newName] = n[oldName];
      delete n[oldName];
      return n;
    });
    setHistoryMap(prev => {
      const out = {};
      Object.keys(prev).forEach(ds => {
        const day = { ...prev[ds] };
        if (day[oldName] !== undefined) {
          day[newName] = day[oldName];
          delete day[oldName];
        }
        out[ds] = day;
      });
      return out;
    });

    toast("✅ " + oldName + " → " + newName + " (" + moved + " data dipindah)");
    setRenameTarget(null);
  } catch (err) {
    console.warn("rename failed", err);
    toast("⚠️ Gagal rename — cek koneksi");
  }
  setRenameSaving(false);
};

  const byDate = {};
  valid.forEach(r => { byDate[r.date] = r; });

  setEditSaving(true);
  try {
    for (const ds of Object.keys(byDate)) {
      const r = byDate[ds];
      const path = attendancePath(batch, ds);
      const snap = await db.ref(path).once("value");
      const val = snap.val() || {};
      // Bangun update per-key supaya tidak menimpa siswa lain.
      const updates = {};
      const k = toFbKey(editStudent);
      if (!r.status) {
        updates[k] = null;
        if (editStudent !== k && val[editStudent] !== undefined) updates[editStudent] = null;
      } else {
        updates[k] = {
          status: r.status,
          reason: r.status === "IZIN" ? (r.reason || "").trim() : ""
        };
        if (editStudent !== k && val[editStudent] !== undefined) updates[editStudent] = null;
      }
      await db.ref(path).update(updates);
    }

    const cur = byDate[dateStr];
    if (cur !== undefined) {
      markDirty(editStudent);
      setAttendance(prev => ({ ...prev, [editStudent]: cur.status || null }));
      setIzinReasons(prev => ({ ...prev, [editStudent]: cur.status === "IZIN" ? (cur.reason || "") : "" }));
    }

    setHistoryMap(prev => {
      const next = { ...prev };
      Object.keys(byDate).forEach(ds => {
        if (next[ds]) {
          const dayMap = { ...next[ds] };
          const r = byDate[ds];
          if (!r.status) delete dayMap[editStudent];
          else dayMap[editStudent] = r.status;
          next[ds] = dayMap;
        }
      });
      return next;
    });

    toast("✅ Absensi " + editStudent + " diupdate (" + Object.keys(byDate).length + " tanggal)");
    setEditStudent(null);

  const buildMatrixForBatch = async (b, dateList) => {
    let namesSnap = null;
    try { namesSnap = await db.ref(studentsPath(b)).once("value"); } catch (e) {}
    let names = namesSnap && namesSnap.val();
    if (!Array.isArray(names) || !names.length) names = BATCH_STUDENTS[b] || [];
    names = names.map(n => String(n).trim()).filter(Boolean).sort((a,c) => a.localeCompare(c, "id"));
    const matrix = {};
    names.forEach(n => { matrix[n] = {}; });
    await Promise.all(dateList.map(ds =>
      db.ref(attendancePath(b, ds)).once("value").then(snap => {
        const val = snap.val() || {};
        names.forEach(n => {
          let st = null;
          const item = val[toFbKey(n)] !== undefined ? val[toFbKey(n)] : val[n];
          if (item && typeof item === "object") st = normalizeStatus(item.status);
          else if (typeof item === "string") st = normalizeStatus(item);
          if (b === batch && ds === dateStr && attendance[n]) st = normalizeStatus(attendance[n]);
          matrix[n][ds] = st;
        });
      }).catch(() => {
        names.forEach(n => { matrix[n][ds] = matrix[n][ds] || null; });
      })
    ));
    const totals = {};
    names.forEach(n => {
      const t = { HADIR:0, IZIN:0, SAKIT:0, ALFA:0 };
      dateList.forEach(ds => {
        const st = matrix[n][ds];
        if (st && t[st] !== undefined) t[st]++;

      totals[n] = t;

    return { names, matrix, totals };

const getStudentsForBatch = async (b) => {

const buildRekapTextFor = async (batchKey, dateList) => {
  const names = await getStudentsForBatch(batchKey);
  if (!names.length) return null;

  const th = BATCH_THEME[batchKey] || {};
  const label = th.label || batchKey;

  const attMap = {};
  names.forEach(n => { attMap[n] = {}; });
  await Promise.all(dateList.map(async ds => {
    try {
      const snap = await db.ref(attendancePath(batchKey, ds)).once("value");
      const val = snap.val() || {};
      names.forEach(n => {
        const item = val[toFbKey(n)] !== undefined ? val[toFbKey(n)] : val[n];
        let st = null;
        if (item && typeof item === "object") st = normalizeStatus(item.status);
        else if (typeof item === "string") st = normalizeStatus(item);
        if (batchKey === batch && ds === dateStr && attendance[n]) st = normalizeStatus(attendance[n]);
        attMap[n][ds] = st;
      });
    } catch {
      names.forEach(n => { attMap[n][ds] = attMap[n][ds] || null; });
    }
  }));

  const [y0, m0, day0] = dateList[0].split("-").map(Number);
  const [yN, mN, dayN] = dateList[dateList.length - 1].split("-").map(Number);
  let dateLabel;
  if (y0 === yN && m0 === mN) dateLabel = `${day0}-${dayN}`;
  else if (y0 === yN) dateLabel = `${day0} ${MONTH_NAMES_RK[m0-1]} - ${dayN} ${MONTH_NAMES_RK[mN-1]}`;
  else dateLabel = `${day0}/${m0}/${y0} - ${dayN}/${mN}/${yN}`;

  let t = `Rekapan (${label})\n`;
  t += `Tanggal: ${dateLabel}\n`;
  names.forEach((name, i) => {
    const emojis = dateList.map(ds => {
      const st = attMap[name][ds];
      if (st === "HADIR") return "✅";
      if (st === "SAKIT") return "🆘";
      if (st === "IZIN") return "ℹ️";
      if (st === "ALFA") return "❌";
      return "⬜";
    }).join("");
    t += `${i + 1}. ${name} ${emojis}\n`;
  });
  t += `\n✅ Hadir · 🆘 Sakit · ℹ️ Izin · ❌ Alfa · ⬜ Belum`;
  return t;
};

  setSalinRekapBusy(true);
  try {
    let dateList = [];
    const today = new Date();
    if (salinRekapRange === "1w") {
      for (let i = 6; i >= 0; i--) dateList.push(dateOffsetStr(today, -i));
    } else if (salinRekapRange === "2w") {
      for (let i = 13; i >= 0; i--) dateList.push(dateOffsetStr(today, -i));
    } else if (salinRekapRange === "1m") {
      const daysInMonth = new Date(salinRekapYear, salinRekapMonth + 1, 0).getDate();
      const s = `${salinRekapYear}-${String(salinRekapMonth+1).padStart(2,"0")}-01`;
      const e = `${salinRekapYear}-${String(salinRekapMonth+1).padStart(2,"0")}-${String(daysInMonth).padStart(2,"0")}`;
      dateList = eachDateStr(s, e);
    } else {
      if (!salinRekapStart || !salinRekapEnd) { toast("⚠️ Pilih tanggal mulai dan akhir"); setSalinRekapBusy(false); return; }
      if (salinRekapStart > salinRekapEnd) { toast("⚠️ Tanggal mulai harus sebelum akhir"); setSalinRekapBusy(false); return; }
      dateList = eachDateStr(salinRekapStart, salinRekapEnd);
    }

    if (!dateList.length) { toast("⚠️ Tidak ada tanggal"); setSalinRekapBusy(false); return; }

    const selectedKeys = Object.keys(salinRekapSelected).filter(k => salinRekapSelected[k]);
    if (!selectedKeys.length) { toast("⚠️ Pilih minimal 1 batch dulu"); setSalinRekapBusy(false); return; }

    const blocks = [];
    for (const k of selectedKeys) {
      try {
        const b = await buildRekapTextFor(k, dateList);
        if (b) blocks.push(b);
      } catch (err) { console.warn("salin rekap batch " + k + " gagal", err); }
    }
    if (!blocks.length) { toast("⚠️ Tidak ada data"); setSalinRekapBusy(false); return; }

    const text = blocks.join("\n\n━━━━━━━━━━━━━━━\n\n");
    setPreviewText(text);
    setShowSalinRekapMenu(false);
    setShowPreview(true);
    setTimeout(() => { if (taRef.current) { taRef.current.focus(); taRef.current.select(); } }, 120);
    const ok = await copyText(text);
    toast(ok ? "✅ Rekap disalin (" + blocks.length + " batch)!" : "⚠️ Teks siap — klik Kirim untuk WA");
  } catch (err) {
    console.warn("salin rekap error", err);
    toast("⚠️ Gagal menyusun rekap");
  }
  setSalinRekapBusy(false);
};

statusListModal && h("div", { style: { position:"fixed", inset:0, zIndex:195, display:"flex", alignItems:"center", justifyContent:"center", padding:16 } }, [
  h("div", { onClick: () => setStatusListModal(null), style: { position:"absolute", inset:0, background:"rgba(0,0,0,.5)", backdropFilter:"blur(6px)" } }),
  h("div", { style: { position:"relative", width:"100%", maxWidth:460, maxHeight:"88vh", borderRadius:24, background:"#fff", padding:24, boxShadow:"0 20px 60px -12px rgba(0,0,0,.4)", animation:"scaleIn .25s ease", display:"flex", flexDirection:"column" } }, [
    h("button", { onClick: () => setStatusListModal(null), style: { position:"absolute", right:12, top:12, width:32, height:32, borderRadius:999, background:"#f4f4f5", border:"none", color:"#71717a", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontSize:14 } }, "✕"),

    h("div", { style:{ fontSize:16, fontWeight:800, marginBottom:4, paddingRight:30, display: "flex", alignItems: "center", gap: 8 } }, [
      h("span", { style: { fontSize: 20 } }, STATUS[statusListModal].icon),
      h("span", null, "Daftar " + statusListModal)
    ]),
    h("div", { style:{ fontSize:12, color:"#64748b", marginBottom:14, fontWeight:600, lineHeight: 1.5 } }, [batchLabel, " · ", formatDateAbsensi(date)]),

    (() => {
      const filteredList = list.filter(n => normalizeStatus(attendance[n]) === statusListModal);
      const searchedList = filteredList.filter(n => n.toLowerCase().includes(statusListSearch.toLowerCase()));

      if (filteredList.length === 0) {
        return h("div", { style:{ padding:36, textAlign:"center", background:"#f8fafc", border:"1px dashed #cbd5e1", borderRadius:14 } }, [
          h("div", { style:{ fontSize: 44, marginBottom: 6 } }, "📭"),
          h("div", { style:{ fontSize:14, fontWeight:800, color:"#64748b" } }, `Belum ada yang ${statusListModal}`),
          h("div", { style:{ fontSize:12, color:"#94a3b8", marginTop:4, fontWeight:600 } }, "0 dari " + list.length + " siswa"),
        ]);
      }

      return h("div", null, [
        h("input", {
          type: "text", value: statusListSearch,
          onChange: e => setStatusListSearch(e.target.value),
          placeholder: "Cari nama...",
          style: { width: "100%", height: 38, padding: "0 12px", borderRadius: 10, border: "1px solid #cbd5e1", fontSize: 13, fontWeight: 600, outline: "none", marginBottom: 10 }
        }),
        h("div", { style:{ flex:1, minHeight: 120, overflowY:"auto", maxHeight:"48vh", border:"1px solid #e2e8f0", borderRadius:12 } },
          searchedList.length === 0
            ? h("div", { style:{ padding:20, textAlign:"center", color:"#94a3b8", fontSize:12, fontWeight:600 } }, ["Tidak ada: ", h("strong", null, `"${statusListSearch}"`)])
            : searchedList.map((name, i) => (
                h("div", { key: name, style:{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", borderBottom: i < searchedList.length-1 ? "1px solid #f1f5f9" : "none" } }, [
                  h("span", { style:{ width:26, height:26, borderRadius:999, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:800, background: STATUS[statusListModal].bg, color: STATUS[statusListModal].text, border: `1px solid ${STATUS[statusListModal].border}` } }, i + 1),
                  h("span", { style:{ flex:1, fontWeight:700, fontSize:13, color:"#1e293b", minWidth: 0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", textTransform:"uppercase" } }, name),
                  statusListModal === "IZIN" && izinReasons[name] && h("span", { style: { fontSize: 11, fontWeight: 700, color: "#1e3a8a", background: "rgba(59,130,246,.1)", padding: "3px 8px", borderRadius: 999, flexShrink: 0 } }, izinReasons[name])
                ])
              ))
        ),
        h("div", { style:{ fontSize:12, fontWeight:800, color: STATUS[statusListModal].border, marginTop:12, textAlign:"center", padding:"8px", background: STATUS[statusListModal].bg, borderRadius:10, border: `1px solid ${STATUS[statusListModal].border}` } },
          searchedList.length !== filteredList.length
            ? `${searchedList.length} dari ${filteredList.length} siswa (difilter)`
            : `${filteredList.length} siswa berstatus ${statusListModal}`)
      ]);
    })()
  ])
]),

h(Toast, { msg: toastMsg, visible: toastVisible })
  ]);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(AbsensiApp));
</script>

</body>
</html>
